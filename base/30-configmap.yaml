# base/30-configmap.yaml - non-secret env, dev values as the base default.
# Per-env overlays patch SPRING_PROFILES_ACTIVE, LOGGING_LEVEL_ROOT, and the
# *.svc.cluster.local hostnames (Kustomize's `namespace:` transformer rewrites
# metadata.namespace on objects, but NOT strings inside ConfigMap data, so
# each overlay must patch these explicitly or staging/prod would silently
# point at dev's Postgres/Redis/Mongo/Kafka).
apiVersion: v1
kind: ConfigMap
metadata:
  name: multistate-api-config
  labels:
    app.kubernetes.io/name: multistate-api
data:
  SPRING_PROFILES_ACTIVE:         k8s
  LOGGING_LEVEL_ROOT:             DEBUG
  SERVER_PORT:                    "8080"
  SPRING_DATASOURCE_URL:          jdbc:postgresql://postgres.multistate-dev.svc.cluster.local:5432/multistate_dev
  SPRING_DATASOURCE_USERNAME:     multistate_dev
  SPRING_DATA_MONGODB_URI:        mongodb://mongo.multistate-dev.svc.cluster.local:27017/multistate
  SPRING_DATA_REDIS_HOST:         redis.multistate-dev.svc.cluster.local
  SPRING_DATA_REDIS_PORT:         "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka.multistate-dev.svc.cluster.local:9092
  OTEL_EXPORTER_OTLP_ENDPOINT:    http://otelcol.multistate-dev.svc.cluster.local:4317
  OTEL_SERVICE_NAME:              multistate-api
  OTEL_TRACES_EXPORTER:  none
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER:    none
