# base/10-multistate-api.deployment.yaml - the workload.
# Copied from the app repo's W5 D3 manifests/10-multistate-api.deployment.yaml,
# namespace left off metadata.namespace (Kustomize's per-overlay `namespace:`
# field rewrites it) and the image left as the placeholder the
# _bump-config.yml workflow rewrites on every green main build.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multistate-api
  labels:
    app.kubernetes.io/name:       multistate-api
    app.kubernetes.io/component:  api
    app.kubernetes.io/part-of:    multistate
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: multistate-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge:       1
  template:
    metadata:
      labels:
        app.kubernetes.io/name:      multistate-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of:   multistate
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser:    65532
        fsGroup:      65532
      containers:
        - name:  multistate-api
          image: uptimecrew/multistate-api:1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: multistate-api-config }
            - secretRef:    { name: multistate-api-secrets }
          env:
            - name:  JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
            # W6D4: anthropic-api Secret is created out-of-band via
            # `kubectl create secret generic anthropic-api --from-literal=...`
            # (see COST.md) -- never committed, so it is not one of the
            # Secrets under base/.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: anthropic-api, key: ANTHROPIC_API_KEY }
            - name: EMBEDDINGS_URL
              value: "http://embeddings.multistate-dev.svc.cluster.local/embed"
          resources:
            requests: { cpu: 250m,  memory: 512Mi }
            limits:   {              memory: 1Gi   }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds:    5
            failureThreshold: 30
            timeoutSeconds:   3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds:      10
            timeoutSeconds:     3
            failureThreshold:   3
            initialDelaySeconds: 0
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds:      5
            timeoutSeconds:     3
            failureThreshold:   3
            successThreshold:   1
            initialDelaySeconds: 0
