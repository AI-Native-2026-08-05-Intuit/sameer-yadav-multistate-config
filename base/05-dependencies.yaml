# base/05-dependencies.yaml - throwaway backing services for the lab.
# multistate-api hard-depends on Postgres, Redis, Mongo, AND Kafka at boot
# (AllocationCreatedListener's @KafkaListener starts eagerly during context
# refresh) -- without these, the Deployment never reaches Ready and the
# Application sticks in Progressing, never Healthy. Single replica, emptyDir
# storage, no persistence/HA: good enough for the app's startup dependency
# checks, not for anything durable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: multistate }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports: [{ name: db, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: multistate_dev }
            - { name: POSTGRES_USER, value: multistate_dev }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: multistate-api-secrets
                  key: SPRING_DATASOURCE_PASSWORD
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "multistate_dev"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ name: db, port: 5432, targetPort: db }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: multistate }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis }
    spec:
      containers:
        - name: redis
          image: redis:7
          ports: [{ name: cache, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ name: cache, port: 6379, targetPort: cache }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  labels: { app.kubernetes.io/name: mongo, app.kubernetes.io/part-of: multistate }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mongo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports: [{ name: doc, containerPort: 27017 }]
          readinessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels: { app.kubernetes.io/name: mongo }
spec:
  selector: { app.kubernetes.io/name: mongo }
  ports: [{ name: doc, port: 27017, targetPort: doc }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: multistate }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kafka }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.1
          ports:
            - { name: broker, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.multistate-dev.svc.cluster.local:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
          readinessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            periodSeconds:      10
            timeoutSeconds:     5
            failureThreshold:   6
            initialDelaySeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: { app.kubernetes.io/name: kafka }
spec:
  selector: { app.kubernetes.io/name: kafka }
  ports:
    - { name: broker, port: 9092, targetPort: broker }
    - { name: controller, port: 9093, targetPort: controller }
