# base/40-multistate-api.secret.yaml - secret env.
# The placeholder below is intentionally NOT the real password. W6 D3 lands
# External Secrets Operator + IRSA to source SPRING_DATASOURCE_PASSWORD from
# AWS Secrets Manager; until then this Secret exists only so envFrom on the
# Deployment resolves, and postgres in 05-dependencies.yaml reads the same
# key so the two never drift apart.
apiVersion: v1
kind: Secret
metadata:
  name: multistate-api-secrets
  labels:
    app.kubernetes.io/name: multistate-api
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: replace-at-apply-time-from-secrets-manager
