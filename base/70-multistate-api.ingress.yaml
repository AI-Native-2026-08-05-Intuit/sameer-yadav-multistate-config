# base/70-multistate-api.ingress.yaml - external reach.
# k3d ships NGINX as its default ingress controller. Each overlay patches
# spec.rules[0].host to the per-env hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multistate-api
  labels:
    app.kubernetes.io/name: multistate-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size:    "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
    - host: multistate.dev.uptimecrew.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: multistate-api
                port: { number: 8080 }
