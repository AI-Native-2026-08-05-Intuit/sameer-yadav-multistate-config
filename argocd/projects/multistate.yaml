# argocd/projects/multistate.yaml
# AppProject scoping the multistate-api capstone team. Every Application in
# this repo has spec.project: multistate -- NEVER "default".
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: multistate
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: multistate-api capstone -- GitOps overlays + observability

  # Narrow on purpose: exactly this repo, no wildcard. A wildcard
  # sourceRepos is indistinguishable from leaving the project in "default"
  # for security purposes.
  sourceRepos:
    - https://github.com/sayymeer/sameer-yadav-multistate-config.git

  # Exactly three (server, namespace) pairs -- no wildcard destination.
  destinations:
    - server:    https://kubernetes.default.svc
      namespace: multistate-dev
    - server:    https://kubernetes.default.svc
      namespace: multistate-staging
    - server:    https://kubernetes.default.svc
      namespace: multistate-prod

  # Cluster-scoped resources: empty whitelist = full deny. The app team has
  # no business creating ClusterRoles, CRDs, or PersistentVolumes -- those
  # are platform-team owned. NOTE: Namespace is also cluster-scoped, so it
  # is deliberately NOT whitelisted here or in namespaceResourceWhitelist
  # below -- base/00-namespace.yaml is never applied by Argo CD; the
  # Application's CreateNamespace=true syncOption creates the namespace
  # instead. (The assignment's reference snippet lists Namespace under
  # namespaceResourceWhitelist, which is a no-op for a cluster-scoped kind
  # -- corrected here; see GITOPS.md's AI-scaffold-audit-style note.)
  clusterResourceWhitelist: []

  # Only the kinds the W5 D3 manifests (now base/ + overlays/) actually use.
  # Ingress is included because base/70-multistate-api.ingress.yaml uses it
  # -- the assignment's reference list omits it, which would break the
  # dev/staging/prod Ingress sync; corrected here.
  namespaceResourceWhitelist:
    - {group: "",                       kind: Service}
    - {group: "",                       kind: ConfigMap}
    - {group: "",                       kind: Secret}
    - {group: "",                       kind: ServiceAccount}
    - {group: apps,                     kind: Deployment}
    - {group: autoscaling,              kind: HorizontalPodAutoscaler}
    - {group: policy,                   kind: PodDisruptionBudget}
    - {group: networking.k8s.io,        kind: NetworkPolicy}
    - {group: networking.k8s.io,        kind: Ingress}
    - {group: monitoring.coreos.com,    kind: ServiceMonitor}
    - {group: monitoring.coreos.com,    kind: PrometheusRule}

  # Platform-team owned -- explicitly blocked even though the app team's
  # namespace has an implicit quota already provisioned by the platform.
  namespaceResourceBlacklist:
    - {group: "", kind: ResourceQuota}
    - {group: "", kind: LimitRange}

  # Deny auto-sync to prod over the weekend. Manual sync still works
  # (manualSync: true), a human can still force-sync on-call.
  syncWindows:
    - kind: deny
      schedule: "0 17 * * 5"        # Friday 17:00 UTC
      duration: 60h                 # through Monday 05:00 UTC
      applications:
        - "multistate-api-prod"
      manualSync: true

  # Project-scoped RBAC -- two roles, not "any-developer-is-admin".
  roles:
    - name: developers
      description: Read everything; sync dev and staging only. No delete.
      policies:
        - p, proj:multistate:developers, applications, get,    multistate/*,                allow
        - p, proj:multistate:developers, applications, sync,   multistate/multistate-api-dev,     allow
        - p, proj:multistate:developers, applications, sync,   multistate/multistate-api-staging, allow
        - p, proj:multistate:developers, applications, delete, multistate/*,                deny
        - p, proj:multistate:developers, logs,         get,    multistate/*,                allow
      groups:
        - uptimecrew:multistate-engineers
    - name: releasers
      description: Full sync including prod. Still cannot delete Applications.
      policies:
        - p, proj:multistate:releasers, applications, get,      multistate/*, allow
        - p, proj:multistate:releasers, applications, sync,     multistate/*, allow
        - p, proj:multistate:releasers, applications, action/*, multistate/*, allow
        - p, proj:multistate:releasers, applications, delete,   multistate/*, deny
      groups:
        - uptimecrew:multistate-engineers-releasers
