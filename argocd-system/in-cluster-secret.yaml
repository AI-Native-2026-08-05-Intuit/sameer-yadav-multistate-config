# argocd-system/in-cluster-secret.yaml
#
# A fresh Argo CD install registers the destination cluster
# (https://kubernetes.default.svc) implicitly -- there is no Secret in the
# argocd namespace to label "cluster: implicit". The ApplicationSet's
# `clusters` generator (argocd/applicationsets/multistate-api-envs.yaml)
# needs a real, labelled cluster Secret to match against, so this file
# registers the in-cluster destination EXPLICITLY, carrying the
# uptimecrew.example.internal/tier: workload label the generator selects on.
#
# This Secret holds NO credentials (config: '{}' means "use the Pod's own
# ServiceAccount", same as the implicit in-cluster registration) -- safe to
# commit. A real multi-cluster fleet would instead register each remote
# cluster's Secret with real bearer-token/TLS config via `argocd cluster add`,
# which must NOT be committed to git.
apiVersion: v1
kind: Secret
metadata:
  name: multistate-in-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    uptimecrew.example.internal/tier: workload
type: Opaque
stringData:
  name: in-cluster
  server: https://kubernetes.default.svc
  config: "{}"
